schemaVersion: 2

projects:
  - name: frontend
    path: projects/frontend
  - name: backend
    path: projects/backend

skills:
  sources:
    - id: mattpocock
      repository: https://github.com/mattpocock/skills
      ref: main
      include:
        - grill-me
        - grilling
        - tdd
        - grill-with-docs
        - to-spec
        - to-tickets
        - implement
        - domain-modeling
        - code-review
    - id: ponytail
      repository: https://github.com/DietrichGebert/ponytail
      ref: v4.8.4
      include:
        - ponytail-review
        - ponytail-audit
        - ponytail-debt

loop:
  evidenceBranch: origin/main
  maxIterations: 8
  maxNoProgressIterations: 3
  maxMinutes: 60
