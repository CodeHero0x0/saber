name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Verify package contents
        run: npm pack --dry-run
      - name: Verify live upstream skill setup
        shell: bash
        run: |
          set -euo pipefail
          workspace="$(mktemp -d)"
          trap 'rm -rf "$workspace"' EXIT
          cp saber.yaml "$workspace/saber.yaml"
          cp -R skills "$workspace/skills"
          mkdir -p "$workspace/projects/frontend/.agents/skills"
          git -C "$workspace/projects/frontend" init --quiet
          (
            cd "$workspace"
            node "$GITHUB_WORKSPACE/dist/main.js" setup
          )
          test -f "$workspace/.saber/managed/manifest.json"
          test -L "$workspace/projects/frontend/.agents/skills/grill-me"
          test -L "$workspace/projects/frontend/.agents/skills/loop"
          test -L "$workspace/projects/frontend/.agents/skills/ponytail-review"
          test -L "$workspace/projects/frontend/.agents/skills/team-knowledge"
          test -L "$workspace/projects/frontend/.agents/skills/promote"
          test -L "$workspace/projects/frontend/.codex/hooks.json"
