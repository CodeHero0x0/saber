name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Validate an initialized team workspace
        shell: bash
        run: |
          set -euo pipefail
          workspace="$(mktemp -d)"
          cd "$workspace"
          node "$GITHUB_WORKSPACE/dist/main.js" init --json
          node "$GITHUB_WORKSPACE/dist/main.js" validate --json
